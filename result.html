<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Interview Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin-top:40px;
}

.header{
    background:#0d6efd;
    color:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

.card{
    margin-top:20px;
    border:none;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

pre{
    white-space:pre-wrap;
    font-family:inherit;
}

.badge{
    font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🎉 Interview Completed</h1>

<h3>{{ name }}</h3>

<h5>{{ role }}</h5>

<span class="badge bg-success mt-2">
AI Interview Report
</span>

</div>

{% for item in answers %}

<div class="card">

<div class="card-body">

<h4 class="text-primary">
Question {{ loop.index }}
</h4>

<p>
<strong>Question:</strong><br>
{{ item.question }}
</p>

<hr>

<p>
<strong>Your Answer:</strong>
</p>

<p>
{{ item.answer }}
</p>

<hr>

<p>
<strong>AI Evaluation:</strong>
</p>

<pre>
{{ item.evaluation }}
</pre>

</div>

</div>

{% endfor %}

<div class="text-center mt-4 mb-5">

<a href="/" class="btn btn-primary btn-lg">
🏠 Take Another Interview
</a>

</div>

</div>

</body>

</html>
