<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Interview Agent</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef2f7;
    font-family:Arial,sans-serif;
}

.container{
    max-width:900px;
    margin-top:40px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.question{
    font-size:28px;
    font-weight:bold;
    color:#0d6efd;
}

textarea{
    resize:none;
    font-size:16px;
}

.timer{
    font-size:22px;
    color:red;
    font-weight:bold;
}

.progress{
    height:12px;
}

</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h1 class="text-center mb-4">
🤖 AI Interview Agent
</h1>

<div class="d-flex justify-content-between">

<h4>
Question {{ number }} of {{ total }}
</h4>

<div class="timer">
⏳ <span id="time">120</span> sec
</div>

</div>

<div class="progress mt-3 mb-4">

<div class="progress-bar progress-bar-striped progress-bar-animated"
style="width: {{ (number/total)*100 }}%">
</div>

</div>

<div class="question mb-4">

{{ question }}

</div>

<form id="interviewForm" action="/next" method="POST">

<textarea
class="form-control"
name="answer"
rows="8"
placeholder="Write your answer here..."
required></textarea>

<br>

<div class="text-end">

<button
type="submit"
class="btn btn-primary btn-lg">

{% if number == total %}
Finish Interview
{% else %}
Next Question →
{% endif %}

</button>

</div>

</form>

</div>

</div>

<script>

let seconds = 120;
let submitted = false;

const timer = document.getElementById("time");
const form = document.getElementById("interviewForm");

// Stop timer after clicking button
form.addEventListener("submit", function(){

    submitted = true;

});

const countdown = setInterval(function(){

    if(submitted){

        clearInterval(countdown);
        return;

    }

    timer.innerHTML = seconds;

    if(seconds<=0){

        submitted = true;

        clearInterval(countdown);

        form.submit();

        return;

    }

    seconds--;

},1000);

</script>

</body>

</html>
