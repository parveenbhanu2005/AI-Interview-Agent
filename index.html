<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Interview Agent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#4F46E5,#06B6D4);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
        }

        .card{
            width:450px;
            border:none;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .logo{
            font-size:60px;
        }

        h2{
            font-weight:bold;
        }

        .btn-custom{
            width:100%;
            background:#4F46E5;
            color:white;
            font-weight:bold;
            padding:12px;
            border-radius:10px;
        }

        .btn-custom:hover{
            background:#3730A3;
            color:white;
        }
    </style>

</head>

<body>

<div class="card p-4">

    <div class="text-center">

        <div class="logo">🤖</div>

        <h2>AI Interview Agent</h2>

        <p class="text-muted">
            Practice AI-powered technical interviews with instant evaluation.
        </p>

    </div>

    <form action="/start" method="POST">

        <div class="mb-3">
            <label class="form-label">Candidate Name</label>
            <input
                type="text"
                class="form-control"
                name="name"
                placeholder="Enter your name"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input
                type="email"
                class="form-control"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <div class="mb-4">
            <label class="form-label">Select Role</label>

            <select
                class="form-select"
                name="role">

                <option>Python Developer</option>
                <option>Data Analyst</option>
                <option>AI Engineer</option>
                <option>Cyber Security Analyst</option>
                <option>Frontend Developer</option>

            </select>

        </div>

        <button class="btn btn-custom" type="submit">
            🚀 Start Interview
        </button>

    </form>

</div>

</body>

</html>
